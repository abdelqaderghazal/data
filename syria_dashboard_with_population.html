<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>سِجل المؤشرات التشغيلية — المحافظات السورية</title>

<!-- ====== THIRD-PARTY ====== -->
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&family=Tajawal:wght@400;500;700;900&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/js-sha256@0.11.0/src/sha256.min.js"></script>

<style>
/* ====== DESIGN TOKENS (SINGLE SOURCE OF TRUTH) ====== */
:root {
  --brand-green: #123C44;
  --brand-green-2: #4F7A63;
  --brand-brass: #B08D57;
  --brand-red: #B5533C;
  --brand-blue: #6E8FA3;
  --brand-ink: #1a1a1a;
  --brand-ink-soft: #5a5a5a;
  --brand-paper: #faf7f0;
  --brand-paper-2: #f3ede0;
  --brand-line: #d9cfb8;
  --brand-success: #2e7d32;
  --brand-warn: #ed6c02;
  --brand-error: #c62828;
  --brand-info: #1565c0;
  --shadow-sm: 0 1px 2px rgba(0,0,0,.06);
  --shadow-md: 0 4px 14px rgba(0,0,0,.08);
  --shadow-lg: 0 12px 36px rgba(0,0,0,.14);
  --radius-sm: 6px;
  --radius-md: 12px;
  --radius-lg: 18px;
  --transition: .18s cubic-bezier(.4,0,.2,1);
}

* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body {
  font-family: 'Cairo', 'Tajawal', system-ui, sans-serif;
  background: var(--brand-paper);
  color: var(--brand-ink);
  line-height: 1.65;
  -webkit-font-smoothing: antialiased;
}

/* ====== UTILITY HELPERS ====== */
.sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0,0,0,0); border: 0; }
.loading { opacity: .55; pointer-events: none; position: relative; }
.loading::after {
  content: ""; position: absolute; inset: 0;
  background: radial-gradient(circle at 50% 40%, rgba(255,255,255,.8), rgba(250,247,240,.9));
  animation: pulse 1.4s ease-in-out infinite;
}
@keyframes pulse { 0%,100% { opacity: .5 } 50% { opacity: .9 } }
.empty-state {
  padding: 32px 20px; text-align: center; color: var(--brand-ink-soft);
  border: 2px dashed var(--brand-line); border-radius: var(--radius-md);
  background: var(--brand-paper-2);
}
.empty-state .icon { font-size: 40px; margin-bottom: 8px; opacity: .5; }

/* ====== MASTHEAD ====== */
.masthead {
  background: linear-gradient(135deg, var(--brand-green) 0%, #0d2c32 100%);
  color: #fff; padding: 28px 24px 22px;
  border-bottom: 4px solid var(--brand-brass);
  position: relative; overflow: hidden;
}
.masthead::before {
  content: ""; position: absolute; inset: 0;
  background:
    radial-gradient(600px 200px at 90% -20%, rgba(176,141,87,.25), transparent 60%),
    radial-gradient(400px 180px at 5% 120%, rgba(181,83,60,.2), transparent 60%);
  pointer-events: none;
}
.masthead-inner {
  max-width: 1400px; margin: 0 auto; position: relative;
  display: flex; align-items: center; gap: 20px;
}
.masthead-emblem {
  width: 72px; height: 72px; flex-shrink: 0;
  background: rgba(255,255,255,.08);
  border: 2px solid rgba(255,255,255,.18);
  border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  backdrop-filter: blur(4px);
}
.masthead-emblem img { width: 54px; height: 54px; object-fit: contain; filter: drop-shadow(0 2px 6px rgba(0,0,0,.35)); }
.masthead-content { flex: 1; min-width: 0; }
.masthead-content .sub {
  margin: 0 0 4px; font-size: 12px; letter-spacing: .08em;
  color: rgba(255,255,255,.72); text-transform: uppercase; font-weight: 600;
}
.masthead-content h1 {
  margin: 0 0 8px; font-family: 'Tajawal'; font-weight: 900;
  font-size: clamp(20px, 2.6vw, 30px); line-height: 1.25;
}
.month-badge {
  display: inline-block; padding: 5px 14px;
  background: rgba(176,141,87,.9); color: #fff;
  border-radius: 100px; font-size: 12.5px; font-weight: 700;
  box-shadow: var(--shadow-sm);
}

/* ====== TOOLBAR ====== */
.toolbar {
  background: var(--brand-paper-2);
  border-bottom: 1px solid var(--brand-line);
  padding: 14px 20px;
  position: sticky; top: 0; z-index: 50;
  backdrop-filter: saturate(1.2) blur(6px);
}
.toolbar-inner {
  max-width: 1400px; margin: 0 auto;
  display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
}
.toolbar-label {
  font-weight: 700; font-size: 13px; color: var(--brand-ink);
  margin-inline-end: 6px;
}
.chip {
  border: 1px solid var(--brand-line); background: #fff; color: var(--brand-ink-soft);
  padding: 6px 14px; border-radius: 100px; cursor: pointer;
  font-family: inherit; font-size: 12.5px; font-weight: 600;
  transition: var(--transition);
}
.chip:hover:not(:disabled) { border-color: var(--brand-green); color: var(--brand-green); transform: translateY(-1px); }
.chip.active {
  background: var(--brand-green); color: #fff; border-color: var(--brand-green);
  box-shadow: 0 2px 8px rgba(18,60,68,.35);
}
.chip:disabled { opacity: .35; cursor: not-allowed; }

/* ====== DATA SOURCE BAR ====== */
.data-panel { max-width: 1400px; margin: 20px auto 0; padding: 0 20px; }
.data-source-bar {
  display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
  background: #fff; border: 1px solid var(--brand-line);
  border-radius: var(--radius-md); padding: 12px 16px;
  box-shadow: var(--shadow-sm);
}
.data-source-bar .label { font-weight: 700; font-size: 13px; color: var(--brand-ink); }
.gsheet-input {
  flex: 1; min-width: 240px;
  border: 1px solid var(--brand-line); border-radius: var(--radius-sm);
  padding: 8px 12px; font-family: 'IBM Plex Mono', monospace; font-size: 12px;
  background: var(--brand-paper-2); color: var(--brand-ink-soft);
  direction: ltr;
}
.btn {
  border: none; border-radius: var(--radius-sm); padding: 9px 16px;
  font-family: inherit; font-size: 13px; font-weight: 700; cursor: pointer;
  transition: var(--transition); display: inline-flex; align-items: center; gap: 6px;
}
.btn:disabled { opacity: .5; cursor: not-allowed; }
.btn-primary { background: var(--brand-green); color: #fff; }
.btn-primary:hover:not(:disabled) { background: #0d2c32; transform: translateY(-1px); box-shadow: var(--shadow-md); }
.btn-success { background: var(--brand-success); color: #fff; }
.btn-success:hover:not(:disabled) { background: #1b5e20; }
.status-badge {
  padding: 5px 12px; border-radius: 100px; font-size: 11.5px;
  font-weight: 700; font-family: 'IBM Plex Mono', monospace;
}
.status-loading { background: #fff3e0; color: var(--brand-warn); }
.status-ok { background: #e8f5e9; color: var(--brand-success); }
.status-error { background: #ffebee; color: var(--brand-error); }

/* ====== KPI GRID ====== */
main { max-width: 1400px; margin: 0 auto; padding: 20px; }
.kpi-grid {
  display: grid; gap: 12px;
  grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
  margin-bottom: 24px;
}
.kpi {
  background: #fff; border: 1px solid var(--brand-line);
  border-radius: var(--radius-md); padding: 16px;
  box-shadow: var(--shadow-sm); transition: var(--transition);
  position: relative; overflow: hidden;
}
.kpi:hover { transform: translateY(-2px); box-shadow: var(--shadow-md); border-color: var(--brand-brass); }
.kpi::before {
  content: ""; position: absolute; inset-inline-start: 0; top: 0; bottom: 0; width: 3px;
  background: linear-gradient(180deg, var(--brand-green), var(--brand-brass));
}
.kpi .seal {
  width: 36px; height: 36px; border-radius: 10px;
  background: var(--brand-paper-2); display: flex; align-items: center; justify-content: center;
  font-size: 18px; margin-bottom: 10px;
}
.kpi .val {
  font-family: 'IBM Plex Mono', monospace; font-weight: 700;
  font-size: 22px; color: var(--brand-ink); line-height: 1.1;
  font-variant-numeric: tabular-nums;
}
.kpi .lbl { font-size: 12px; color: var(--brand-ink-soft); margin-top: 4px; line-height: 1.4; }

/* ====== CATEGORY SECTIONS ====== */
.category {
  background: #fff; border: 1px solid var(--brand-line);
  border-radius: var(--radius-lg); margin-bottom: 20px;
  box-shadow: var(--shadow-sm); overflow: hidden;
}
.cat-head {
  display: flex; align-items: center; gap: 14px;
  padding: 18px 22px; cursor: pointer; user-select: none;
  background: linear-gradient(90deg, var(--brand-paper-2), transparent 70%);
  border-bottom: 1px solid var(--brand-line);
  transition: var(--transition);
}
.cat-head:hover { background: linear-gradient(90deg, #ece3cd, transparent 70%); }
.cat-head .icon {
  width: 44px; height: 44px; border-radius: 12px; flex-shrink: 0;
  background: var(--brand-green); color: #fff;
  display: flex; align-items: center; justify-content: center; font-size: 20px;
  box-shadow: 0 4px 12px rgba(18,60,68,.3);
}
.cat-head h2 { margin: 0; font-family: 'Tajawal'; font-weight: 900; font-size: 17px; }
.cat-head p { margin: 2px 0 0; font-size: 12.5px; color: var(--brand-ink-soft); }
.cat-head .chev {
  margin-inline-start: auto; font-size: 20px; color: var(--brand-brass);
  transition: transform var(--transition);
}
.category:not(.open) .cat-head .chev { transform: rotate(-90deg); }
.cat-body { padding: 22px; display: none; }
.category.open .cat-body { display: block; }
.cat-note {
  background: var(--brand-paper-2); border-inline-start: 3px solid var(--brand-brass);
  padding: 10px 14px; border-radius: 6px; font-size: 12.5px;
  color: var(--brand-ink-soft); margin: 0 0 16px;
}
.chart-wrap { position: relative; width: 100%; }
.ind-cards {
  display: grid; gap: 10px; margin-top: 18px;
  grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
}
.ind-card {
  display: flex; align-items: center; gap: 12px;
  background: var(--brand-paper-2); border: 1px solid var(--brand-line);
  border-radius: 10px; padding: 12px 14px; transition: var(--transition);
}
.ind-card:hover { border-color: var(--brand-green); transform: translateY(-1px); }
.ind-card .em { font-size: 24px; }
.ind-card .n {
  font-family: 'IBM Plex Mono', monospace; font-weight: 700;
  font-size: 16px; color: var(--brand-ink); font-variant-numeric: tabular-nums;
}
.ind-card .t { font-size: 11.5px; color: var(--brand-ink-soft); line-height: 1.4; }

/* ====== MAP ====== */
.map-section .cat-body { padding: 0; }
#govMap { height: 520px; width: 100%; }
.map-legend {
  position: absolute; top: 14px; inset-inline-end: 14px; z-index: 400;
  background: rgba(255,255,255,.96); backdrop-filter: blur(6px);
  border: 1px solid var(--brand-line); border-radius: 10px;
  padding: 10px 14px; font-size: 12px;
  box-shadow: var(--shadow-md);
}
.legend-item { display: flex; align-items: center; gap: 8px; margin-top: 4px; }
.legend-dot { width: 12px; height: 12px; border-radius: 50%; border: 1.5px solid #fff; box-shadow: 0 0 0 1px rgba(0,0,0,.15); }

/* ====== GOV LIST ====== */
.gov-list { display: grid; gap: 8px; }
.gov-item { border: 1px solid var(--brand-line); border-radius: 10px; overflow: hidden; }
.gh {
  display: flex; align-items: center; gap: 12px;
  padding: 12px 16px; cursor: pointer; background: var(--brand-paper-2);
  transition: var(--transition);
}
.gh:hover { background: #ece3cd; }
.gh .stamp {
  width: 36px; height: 36px; border-radius: 50%;
  background: var(--brand-green); color: #fff;
  display: flex; align-items: center; justify-content: center;
  font-weight: 900; font-family: 'Tajawal';
}
.gh strong { flex: 1; }
.gh .chev { color: var(--brand-brass); transition: transform var(--transition); }
.gov-item.open .gh .chev { transform: rotate(180deg); }
.gb { padding: 0 16px; display: none; }
.gov-item.open .gb { display: block; padding: 14px 16px; border-top: 1px solid var(--brand-line); }
.gb .row { display: flex; gap: 12px; padding: 8px 0; border-bottom: 1px dashed var(--brand-line); }
.gb .row:last-child { border-bottom: none; }
.gb .row b { min-width: 150px; color: var(--brand-green); font-size: 13px; }
.gb .row span { flex: 1; font-size: 13px; color: var(--brand-ink); }
.empty-note { color: var(--brand-ink-soft); font-style: italic; }

/* ====== FOOTER ====== */
footer {
  max-width: 1400px; margin: 20px auto 40px; padding: 0 20px;
  color: var(--brand-ink-soft); font-size: 12.5px; text-align: center;
}
footer .line {
  background: #fff8e1; border: 1px solid #ffe082; color: #8d6e00;
  padding: 10px 16px; border-radius: 8px; margin-bottom: 10px; font-weight: 600;
}

/* ====== MODAL ====== */
.modal-overlay {
  position: fixed; inset: 0; background: rgba(10,10,10,.55);
  z-index: 1000; display: none; align-items: center; justify-content: center;
  padding: 20px; backdrop-filter: blur(3px);
}
.modal-overlay.open { display: flex; animation: fadeIn .2s ease; }
@keyframes fadeIn { from { opacity: 0 } to { opacity: 1 } }
.modal-box {
  background: var(--brand-paper); border-radius: var(--radius-lg);
  width: 100%; max-width: 560px; max-height: 90vh; overflow: auto;
  box-shadow: var(--shadow-lg); border: 2px solid var(--brand-brass);
  animation: slideUp .25s ease;
}
@keyframes slideUp { from { transform: translateY(20px); opacity: 0 } to { transform: none; opacity: 1 } }
.modal-header {
  display: flex; align-items: center; justify-content: space-between;
  padding: 16px 22px; border-bottom: 1px solid var(--brand-line);
}
.modal-header h3 { margin: 0; font-family: 'Tajawal'; font-weight: 900; font-size: 17px; }
.modal-close {
  background: none; border: none; font-size: 26px; cursor: pointer;
  color: var(--brand-ink-soft); line-height: 1; padding: 0 4px;
}
.modal-close:hover { color: var(--brand-error); }
.modal-body { padding: 20px 22px; }
.help-box {
  background: #e3f2fd; border: 1px solid #90caf9; color: #0d47a1;
  border-radius: 10px; padding: 12px 14px; font-size: 12.5px; line-height: 1.8; margin-bottom: 16px;
}
.file-drop-zone {
  border: 2.5px dashed var(--brand-line); border-radius: 14px;
  padding: 30px 20px; text-align: center; cursor: pointer;
  transition: var(--transition); background: var(--brand-paper-2);
}
.file-drop-zone:hover, .file-drop-zone.dragover {
  border-color: var(--brand-green); background: #e8f5e9; color: var(--brand-green);
}

/* ====== AUTH OVERLAY ====== */
.password-overlay {
  position: fixed; inset: 0; z-index: 2000;
  background:
    radial-gradient(1000px 600px at 20% 0%, rgba(176,141,87,.35), transparent 60%),
    radial-gradient(800px 500px at 100% 100%, rgba(181,83,60,.3), transparent 60%),
    linear-gradient(135deg, var(--brand-green) 0%, #0a1f24 100%);
  display: flex; align-items: center; justify-content: center; padding: 20px;
}
.password-box {
  background: var(--brand-paper); border-radius: 20px; padding: 36px 32px;
  max-width: 440px; width: 100%; text-align: center;
  box-shadow: 0 30px 80px rgba(0,0,0,.45);
  border: 2px solid var(--brand-brass);
  animation: popIn .35s cubic-bezier(.34,1.56,.64,1);
}
@keyframes popIn { from { transform: scale(.92); opacity: 0 } to { transform: none; opacity: 1 } }
.password-box .lock-icon { font-size: 52px; margin-bottom: 10px; filter: drop-shadow(0 4px 8px rgba(0,0,0,.2)); }
.password-box h2 { font-family: 'Tajawal'; font-weight: 900; font-size: 22px; margin: 0 0 6px; color: var(--brand-green); }
.password-box p { color: var(--brand-ink-soft); font-size: 13px; margin: 0 0 20px; }
.password-box input {
  width: 100%; border: 2px solid var(--brand-line); border-radius: 10px;
  padding: 12px 16px; font-family: 'IBM Plex Mono', monospace; font-size: 16px;
  text-align: center; letter-spacing: 4px; background: #fff; margin-bottom: 12px;
  transition: var(--transition);
}
.password-box input:focus { outline: none; border-color: var(--brand-green); box-shadow: 0 0 0 4px rgba(18,60,68,.12); }
.btn-login {
  width: 100%; padding: 13px; font-family: inherit; font-size: 15px; font-weight: 900;
  background: var(--brand-green); color: #fff; border: none; border-radius: 10px;
  cursor: pointer; transition: var(--transition);
}
.btn-login:hover:not(:disabled) { background: #0a1f24; transform: translateY(-1px); box-shadow: var(--shadow-md); }
.btn-login:disabled { opacity: .6; cursor: not-allowed; }
.error-msg { color: var(--brand-error); font-size: 12.5px; margin-top: 10px; display: none; font-weight: 700; }
.error-msg.show { display: block; animation: shake .35s ease; }
@keyframes shake { 0%,100%{transform:translateX(0)} 25%{transform:translateX(-6px)} 75%{transform:translateX(6px)} }
body.locked { overflow: hidden; }
body.locked > *:not(.password-overlay) { display: none; }

.user-type-selector { display: flex; flex-direction: column; gap: 8px; margin-bottom: 16px; text-align: start; }
.user-type-option {
  display: flex; align-items: center; gap: 12px; padding: 12px 14px;
  border: 2px solid var(--brand-line); border-radius: 10px; cursor: pointer;
  background: #fff; transition
